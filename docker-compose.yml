# deployed with wetfish/server, see README.md
services:
  # httpd
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    # nginx needs php running before it starts
    depends_on:
      - php
    healthcheck:
      # nginx is healthy once it can reach php-fpm, see config/nginx.conf
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/fpm-ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # php-fpm
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    # db connection info, filled in from setup.conf on a server
    env_file:
      - ./php.env
    # sessions are kept here, capped at 64 MB so they can't eat the server's memory
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
