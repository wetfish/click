server {
	listen 80;

	index index.php index.html;

	root /var/www;

	# hide the nginx version
	server_tokens off;

	# real visitor ip, sent by the wetfish/server proxy
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Real-IP;

	# docker's dns server; a variable in fastcgi_pass makes nginx look the
	# address up again when it expires, instead of once at startup, so it
	# finds the php container again after a deploy replaces it
	resolver 127.0.0.11 valid=5s ipv6=off;
	set $php_upstream php:9000;

	# no dotfiles, such as .htaccess, or package manifests
	location ~ /\. {
		return 404;
	}

	location ~ (^|/)package(-lock)?\.json$ {
		return 404;
	}

	location / {
		# no directory listings, anything that isn't a file is a click page
		autoindex off;
		try_files $uri $uri/ /index.php?page=$uri&$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass $php_upstream;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}

	# php-fpm's ping page, only for the container health check
	location = /fpm-ping {
		access_log off;
		allow 127.0.0.1;
		deny all;
		fastcgi_pass $php_upstream;
		include fastcgi_params;
	}
}
