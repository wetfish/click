; click's own php settings, loaded on top of php.ini-production

; don't advertise the php version in headers
expose_php = Off

; click shows post times in utc
date.timezone = UTC

; mitigation for CVE-2026-115560 until php ships a fix,
; click never tracks upload progress
session.upload_progress.enabled = 0

; click never fetches urls or takes file uploads
allow_url_fopen = Off
file_uploads = Off
