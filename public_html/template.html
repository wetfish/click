		<script src='/node_modules/wetfish-basic/dist/basic.js'></script>
		<script src='/click.js'></script>

		<script>
			function Trim (str)
			{
				str = str.replace(/<br>/ig, '');
				str = str.replace(/&nbsp;/ig, '');
				return str.replace(/(^\s+|\s+$)/g, '');
			}

			function Render()
			{
				var HTML = $('#input').el[0].innerHTML;

				HTML = HTML.replace(/&amp;/g, '&');
				HTML = HTML.replace(/&lt;/g, '<');
				HTML = HTML.replace(/&gt;/g, '>');

				Current.submit = Timeout.submit;
				$('#input').html(HTML);
			}

			function UnRender()
			{
				var HTML = $('#input').el[0].innerHTML;

				HTML = HTML.replace(/&/g, '&amp;');
				HTML = HTML.replace(/</g, '&lt;');
				HTML = HTML.replace(/>/g, '&gt;');

				Current.submit = Timeout.submit;
				$('#input').html(HTML);
			}

			var Last;
			var Timeout = new Object;

			Timeout.refresh = 5;
			Timeout.submit = 4;

			var Current = new Object;

			Current.refresh = 0;
			Current.submit = Timeout.submit;

			function Update()
			{
				if(Current.refresh == 0)
				{
					Get('/current.php?page=$Page', function(Data)
					{
						if(Last == Data)
						{
							Timeout.refresh = Math.ceil(Timeout.refresh * 2);

							if(Timeout.refresh > 60)
								Timeout.refresh = 60;

							Current.refresh = Timeout.refresh;
						}

						else if(Data)
						{
							$('#input').style({'background-image': 'url(/background.png)'});
							$('#current').html(Data);

							Last = Data;

							Timeout.refresh = Math.ceil(Timeout.refresh / 2);
							Current.refresh = Timeout.refresh;
						}
					});

					Get('/history.php?page=$Page&p=$Derp', function(Data)
					{
						if(Data)
						{
							$('#history').html(Data);
						}
					});
				}
				else
				{
					if(Timeout.stopped != true)
					{
						Current.refresh--;
						$('#refresh').value('Refresh [' + Current.refresh + ']');
					}
				}
			}

			$(document).ready(function ()
			{
				setInterval( "Update()", 1000 );

				Get('/current.php?page=$Page', function(Data) { $('#current').html(Data); });
				Get('/history.php?page=$Page', function(Data) { $('#history').html(Data); });

				var Default = 'Care to write something?';

				$('#input').attr('contenteditable', 'true');
				$('#input').html(Default);

				$('#input').on('mousedown', function()
				{
					if($('#input').el[0].innerHTML == Default)
					{
						$('#input').html('&nbsp;');
					}

					if(Timeout.stopped != true)
						Timeout.started = true;

					Current.submit = Timeout.submit;
				});

				$('#input').on('keydown', function(event)
				{
					if(event.keyCode == 13 &&
						event.altKey == false &&
						event.ctrlKey == false &&
						event.shiftKey == false)
					{
						event.preventDefault();
						Send();
					}
				});

				$('#input').on('blur', function()
				{
					if(Trim($('#input').el[0].innerHTML) == '')
					{
						$('#input').html(Default);

						Timeout.started = false;
						Timeout.stopped = false;

						$('#submit').value('Submit');


					}
				});

				$('#stop').on('click', function()
				{
					Timeout.started = false;
					Timeout.stopped = true;
				});

				// sends the post, from the submit button or the enter key. enter
				// calls it directly, since firefox submits the whole page for a
				// submit event that a script sends.
				function Send()
				{
					$('#input').style({'background-image': "url(/super.gif)"});

					var dont = 'asdhAsjdalk';
					var spam = 'asokjAa(Aaajs';
					var me = 'sksA2alA;sak';

					Post('submit.php?page=$Page', {data: $('#input').el[0].innerHTML, please: dont + spam + me }, function(error)
					{
						if(error)
							alert(error);

						$('#input').html('');
						//$('#input').html(Default);
						//$('#input').blur();

						Current.refresh = 0;
						Timeout.refresh = 5;
						Timeout.started = false;
						Timeout.stopped = false;

						$('#submit').value('Submit');
					});
				}

				$('#form').on('submit', function(event)
				{
					Send();
					event.preventDefault();
				});

				$('#refresh').on('click', function()
				{
					Current.refresh = 0;
					Timeout.refresh = 5;
					Timeout.started = false;
					Timeout.stopped = false;
				});
			});
		</script>
	</head>

				<input id='submit' type='submit' value='Submit' />

					<input id='refresh' type='button' value='Refresh' />
